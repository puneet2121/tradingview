{% extends "registration/base.html" %}
{% block content %}
<h2>Sign in</h2>
{% if form.errors %}<p class="error" role="alert">Unable to sign in. Check your username and password.</p>{% endif %}
<form method="post" action="{% url 'login' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <label for="id_username">Username</label>
  <input id="id_username" name="username" value="{{ form.username.value|default:'' }}" maxlength="150" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label for="id_password">Password</label>
  <input id="id_password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
